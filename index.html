<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NibblesX AI</title>
  <style>
    :root {
      --bg: #0c0d10;
      --panel: #16181d;
      --border: #262931;
      --text: #e6edf3;
      --dim: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Consolas', 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation / Config Bar */
    .header-bar {
      background-color: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .brand-title {
      font-weight: bold;
      color: var(--accent);
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    .config-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .config-group label {
      color: var(--dim);
      font-size: 0.75rem;
      font-weight: bold;
    }

    .config-group input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      font-family: inherit;
      font-size: 0.85rem;
      border-radius: 4px;
      outline: none;
    }

    .config-group input:focus {
      border-color: var(--accent);
    }

    .btn-save {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 5px 10px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Terminal Console Window */
    #terminal {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .line { word-break: break-word; }
    .line.user { color: var(--accent); }
    .line.bot { color: var(--text); }
    .line.sys { color: var(--dim); font-style: italic; }
    .line.error { color: var(--red); }

    pre {
      background: #111318;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
    }

    code { font-family: inherit; }

    /* Input Footer */
    .input-bar {
      border-top: 1px solid var(--border);
      background-color: var(--panel);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .prompt-symbol {
      color: var(--accent);
      font-weight: bold;
    }

    #cmdInput {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Top Config Bar -->
  <div class="header-bar">
    <div class="brand-title">NIBBLESX TERMINAL</div>

    <div class="config-group">
      <label for="apiKeyInput">GEMINI KEY:</label>
      <input type="password" id="apiKeyInput" style="width: 180px;" placeholder="Paste API Key..." />
      <button class="btn-save" id="saveBtn">SAVE</button>
    </div>
  </div>

  <!-- Output Console -->
  <div id="terminal">
    <div class="line sys">[NIBBLESX.ABRDNS.COM ONLINE]</div>
    <div class="line sys">Paste your free Gemini API key above and click SAVE to initialize.</div>
  </div>

  <!-- Input Bar -->
  <div class="input-bar">
    <span class="prompt-symbol">$</span>
    <input type="text" id="cmdInput" placeholder="Enter prompt or command..." autofocus />
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const cmdInput = document.getElementById('cmdInput');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveBtn = document.getElementById('saveBtn');

    // Load saved key from localStorage
    apiKeyInput.value = localStorage.getItem('nibblesx_gemini_key') || '';

    saveBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      localStorage.setItem('nibblesx_gemini_key', key);
      printLine('[SYS] Gemini API Key saved locally!', 'sys');
    });

    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = cmdInput.value.trim();
        if (!val) return;
        cmdInput.value = '';

        if (val === '/clear') {
          terminal.innerHTML = '';
          return;
        }

        printLine(`$ ${val}`, 'user');
        sendGeminiPrompt(val);
      }
    });

    function printLine(text, type = 'bot') {
      const div = document.createElement('div');
      div.className = `line ${type}`;

      if (type === 'bot') {
        div.innerHTML = parseMarkdown(text);
      } else {
        div.innerText = text;
      }

      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
      return div;
    }

    async function sendGeminiPrompt(promptText) {
      const apiKey = localStorage.getItem('nibblesx_gemini_key') || apiKeyInput.value.trim();

      if (!apiKey) {
        printLine('Error: No Gemini API Key set. Paste your key in the top bar and click SAVE.', 'error');
        return;
      }

      const loader = printLine('thinking...', 'sys');
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        loader.remove();

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          printLine(`API Error (${response.status}): ${errData.error?.message || 'Failed to reach Gemini.'}`, 'error');
          return;
        }

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '[No response text returned]';
        printLine(reply, 'bot');

      } catch (err) {
        loader.remove();
        printLine(`Connection Error: ${err.message}`, 'error');
      }
    }

    function parseMarkdown(str) {
      return str
        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }
  </script>
</body>
</html>
